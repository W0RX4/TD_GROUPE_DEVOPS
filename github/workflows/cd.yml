name: CD
on:
  push:
    branches: [dev, val, main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.v.outputs.env }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ENV=${GITHUB_REF_NAME}
          [ "$ENV" = "main" ] && ENV=prod
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$ENV-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-backend:${{ steps.v.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-frontend:${{ steps.v.outputs.tag }}

  deploy:
    needs: build
    if: github.ref_name != 'dev'
    runs-on: self-hosted
    environment: ${{ needs.build.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          ENV=${{ needs.build.outputs.env }}
          cd k8s/overlays/$ENV
          sed -i "s/TAG_PLACEHOLDER/${{ needs.build.outputs.tag }}/g; s/DOCKERHUB_USER/${{ secrets.DOCKERHUB_USERNAME }}/g" kustomization.yaml
          kubectl create namespace $ENV --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k .
          kubectl -n $ENV rollout status deployment/backend --timeout=120s
          kubectl -n $ENV rollout status deployment/frontend --timeout=120s
