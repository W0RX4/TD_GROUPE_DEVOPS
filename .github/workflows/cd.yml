name: CD
on:
  push:
    branches: [dev, val, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build et push
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t pgosseli/td-api:$TAG ./api
          docker build -t pgosseli/td-front:$TAG ./front
          docker push pgosseli/td-api:$TAG
          docker push pgosseli/td-front:$TAG

  deploy:
    needs: build
    if: github.ref_name != 'dev'
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'prod' || 'val' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          ENV=${{ github.ref_name == 'main' && 'prod' || 'val' }}
          TAG=${GITHUB_SHA::7}
          sed -i "s/TAG/$TAG/g" k8s/app/*.yaml
          kubectl apply -n $ENV -f k8s/app/
          kubectl rollout status deployment/api -n $ENV --timeout=120s
          kubectl rollout status deployment/front -n $ENV --timeout=120s
